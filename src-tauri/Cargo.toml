[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "smt-task-manager"
version = "1.0.0-pre"
description = "SMT Task Manager — process management app"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
smt-core = { path = "core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "rt"] }
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
portable-pty = "0.8"
strip-ansi-escapes = "0.2.1"
serde_yaml_ng = "0.9"
tauri-plugin-dialog = "2.7.2"
axum = { version = "0.8.4", features = ["ws"] }
sha2 = "0.10.9"

[features]
# 该 feature 决定 tauri-build 生成生产(dev=false)还是开发(dev=true)上下文：
# 关闭时会走 devUrl(http://localhost:1420) 而不是内嵌资源，前端直接空白。
# 默认开启，使 `cargo build --release` 直接产出可独立运行的 exe。
# 注意：开启后 `cargo tauri dev` 也不再走 vite 热更新，加载内嵌构建产物。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 发布体积极限压缩：全量 LTO + 单单元 + 去符号 + 尺寸优先 + abort
# （进程管理应用对吞吐不敏感，牺牲一点运行速度换体积）
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"
