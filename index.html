<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMT Task Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#141518" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SMT" />
    <style>
      /* 首屏加载占位：消除 WebView 初始化期间的白色空白闪烁 */
      html, body { margin: 0; padding: 0; background: #0c0f18; }
      #root {
        width: 100vw; height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #0c0f18;
      }
      #root::before {
        content: '';
        display: block;
        width: 48px; height: 48px;
        border: 3px solid rgba(99,102,241,0.25);
        border-top-color: rgba(99,102,241,0.9);
        border-radius: 50%;
        animation: _smt-spin 0.7s linear infinite;
      }
      @keyframes _smt-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
